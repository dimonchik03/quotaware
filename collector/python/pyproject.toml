[project]
name = "quotaware-httpx"
version = "0.2.0"
description = "httpx event hooks that report provider rate-limit headers and usage to quotaware"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
license = "MIT"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["quotaware_httpx"]

[project]
name = "quotaware-httpx"
version = "0.2.0"
description = "httpx event hooks that report provider rate-limit headers and usage to quotaware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/dimonchik03/quotaware"
Source = "https://github.com/dimonchik03/quotaware/tree/main/collector/python"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["quotaware_httpx"]

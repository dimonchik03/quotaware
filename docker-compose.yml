services:
  fakeprovider:
    build:
      context: .
      args:
        CMD: ./bench/cmd/fakeprovider
    command: ["-listen", ":8081", "-rpm", "3", "-tpm", "50000", "-latency", "100ms", "-jitter", "20ms", "-seed", "1"]

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"

  proxy:
    build:
      context: .
    command:
      - all
      - -listen=:8080
      - -admin=:9100
      - -grpc=:9090
      - -openai-upstream=http://fakeprovider:8081
      - -anthropic-upstream=http://fakeprovider:8081
      - -redis-address=redis:6379
    environment:
      QUOTAWARE_OBSERVE_TOKEN: e2e-observe-token
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19090:9090"
      - "127.0.0.1:19100:9100"
    depends_on:
      - fakeprovider
      - redis

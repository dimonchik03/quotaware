image:
  repository: ghcr.io/dimonchik03/quotaware
  tag: ""
  pullPolicy: IfNotPresent

upstreams:
  openai: https://api.openai.com
  anthropic: https://api.anthropic.com

ports:
  proxy: 8080
  grpc: 9090
  admin: 9100

ewmaAlpha: 0.2
maxBuckets: 10000
maxScaledObjects: 1000
redisAddresses: []

observe:
  token: ""
  existingSecret: ""
  secretKey: observe-token
  insecure: false

networkPolicy:
  enabled: true
  keda:
    namespace: keda
    podLabels: {}
  grpcFrom: []
  proxyFrom: []
  adminFrom: []

extraArgs: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

prometheusAnnotations: true
podAnnotations: {}
podLabels: {}
imagePullSecrets: []

nodeSelector: {}
tolerations: []
affinity: {}

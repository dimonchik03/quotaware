{{- if not (or .Values.observe.token .Values.observe.existingSecret .Values.observe.insecure) }}
{{- fail "quotaware refuses unauthenticated observations: set observe.token, observe.existingSecret, or observe.insecure=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quotaware.fullname" . }}
  labels:
    {{- include "quotaware.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "quotaware.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quotaware.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if and .Values.observe.token (not .Values.observe.existingSecret) }}
        checksum/observe-token: {{ .Values.observe.token | sha256sum }}
        {{- end }}
        {{- if .Values.prometheusAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.ports.admin | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: quotaware
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - all
            - {{ printf "-listen=:%v" .Values.ports.proxy | quote }}
            - {{ printf "-grpc=:%v" .Values.ports.grpc | quote }}
            - {{ printf "-admin=:%v" .Values.ports.admin | quote }}
            - {{ printf "-openai-upstream=%s" .Values.upstreams.openai | quote }}
            - {{ printf "-anthropic-upstream=%s" .Values.upstreams.anthropic | quote }}
            - {{ printf "-ewma-alpha=%v" .Values.ewmaAlpha | quote }}
            - {{ printf "-max-buckets=%d" (.Values.maxBuckets | int) | quote }}
            - {{ printf "-max-scaled-objects=%d" (.Values.maxScaledObjects | int) | quote }}
            {{- with .Values.redisAddresses }}
            - {{ printf "-redis-address=%s" (join "," .) | quote }}
            {{- end }}
            {{- if .Values.observe.insecure }}
            - -observe-insecure
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or .Values.observe.token .Values.observe.existingSecret }}
          env:
            - name: QUOTAWARE_OBSERVE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observe.existingSecret | default (printf "%s-observe" (include "quotaware.fullname" .)) }}
                  key: {{ .Values.observe.secretKey }}
          {{- end }}
          ports:
            - name: proxy
              containerPort: {{ .Values.ports.proxy }}
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: admin
              containerPort: {{ .Values.ports.admin }}
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if and .Values.observe.token (not .Values.observe.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quotaware.fullname" . }}-observe
  labels:
    {{- include "quotaware.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.observe.secretKey }}: {{ .Values.observe.token | b64enc | quote }}
{{- end }}

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: chart and package versions match the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          chart_version="$(sed -n 's/^version: \(.*\)$/\1/p' deploy/helm/quotaware/Chart.yaml)"
          app_version="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' deploy/helm/quotaware/Chart.yaml)"
          package_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' collector/python/pyproject.toml)"
          for found in "chart version:$chart_version" "chart appVersion:$app_version" "python package version:$package_version"; do
            if [ "${found#*:}" != "$expected" ]; then
              echo "${found%%:*} is '${found#*:}', the tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -p 2 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/python/requirements.txt pytest
      - run: python -m pytest -q collector/python

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

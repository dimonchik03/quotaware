name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -p 2 ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: the image builds with the Go version go.mod names
        run: |
          want="$(sed -n 's/^go //p' go.mod)"
          grep -q "golang:${want}-alpine" Dockerfile || { echo "Dockerfile does not build with Go ${want} from go.mod" >&2; exit 1; }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.1
      - run: helm lint deploy/helm/quotaware --set observe.insecure=true --strict
      - run: |
          if helm template quotaware deploy/helm/quotaware --set observe.insecure=true --set maxScaledObjects=1 > "$RUNNER_TEMP/slots.log" 2>&1; then exit 1; fi
          grep -q "maxScaledObjects must be at least 2" "$RUNNER_TEMP/slots.log"
      - run: helm template quotaware deploy/helm/quotaware --set observe.token=example > /dev/null
      - run: helm template quotaware deploy/helm/quotaware --set observe.existingSecret=quotaware-observe > /dev/null
      - run: |
          if helm template quotaware deploy/helm/quotaware > "$RUNNER_TEMP/unauthenticated.log" 2>&1; then exit 1; fi
          grep -q "refuses unauthenticated observations" "$RUNNER_TEMP/unauthenticated.log"
      - run: |
          helm template quotaware deploy/helm/quotaware --set observe.token=example > "$RUNNER_TEMP/with-policy.yaml"
          grep -q "kind: NetworkPolicy" "$RUNNER_TEMP/with-policy.yaml"
          helm template quotaware deploy/helm/quotaware --set observe.token=example --set networkPolicy.enabled=false > "$RUNNER_TEMP/without-policy.yaml"
          if grep -q NetworkPolicy "$RUNNER_TEMP/without-policy.yaml"; then exit 1; fi
      - run: |
          helm template quotaware deploy/helm/quotaware --set observe.token=example > "$RUNNER_TEMP/rendered.yaml"
          for expected in "automountServiceAccountToken: false" "runAsNonRoot: true" "readOnlyRootFilesystem: true" "allowPrivilegeEscalation: false" "checksum/observe-token:"; do
            grep -q "$expected" "$RUNNER_TEMP/rendered.yaml" || { echo "chart lacks $expected" >&2; exit 1; }
          done
          helm template quotaware deploy/helm/quotaware --set observe.token=example --set maxBuckets=2000000 | grep -q -- "-max-buckets=2000000"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: make e2e

  python-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python: "3.10"
            httpx: "httpx==0.27.*"
          - python: "3.14"
            httpx: "httpx"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./collector/python "${{ matrix.httpx }}" pytest "brotli>=1.2" zstandard
      - run: python -c "import quotaware_httpx; assert 'site-packages' in quotaware_httpx.__file__, quotaware_httpx.__file__"
      - run: python -m pytest -q --import-mode=importlib collector/python

  commits:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: commit subjects follow Conventional Commits in at most 72 characters
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          while IFS= read -r subject; do
            if [ "${#subject}" -gt 72 ] || ! printf '%s' "$subject" | grep -qE '^(feat|fix|refactor|test|docs|chore|build|ci|perf)(\([a-z0-9-]+\))?: [a-z]'; then
              echo "::error::$subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit "$bad"

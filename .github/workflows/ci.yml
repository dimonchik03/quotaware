name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -p 2 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: v2.12.2
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: helm lint deploy/helm/quotaware --set observe.insecure=true --strict
      - run: helm template quotaware deploy/helm/quotaware --set observe.token=example > /dev/null
      - run: helm template quotaware deploy/helm/quotaware --set observe.existingSecret=quotaware-observe > /dev/null
      - run: "! helm template quotaware deploy/helm/quotaware > /dev/null 2>&1"
      - run: |
          helm template quotaware deploy/helm/quotaware --set observe.token=example > "$RUNNER_TEMP/with-policy.yaml"
          grep -q "kind: NetworkPolicy" "$RUNNER_TEMP/with-policy.yaml"
          helm template quotaware deploy/helm/quotaware --set observe.token=example --set networkPolicy.enabled=false > "$RUNNER_TEMP/without-policy.yaml"
          if grep -q NetworkPolicy "$RUNNER_TEMP/without-policy.yaml"; then exit 1; fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: make e2e

  python-collector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./collector/python pytest
      - run: python -m pytest -q collector/python

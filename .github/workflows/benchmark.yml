name: changing-quota benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/benchmark.yml
      - bench/bench.sh
      - bench/fakeprovider/**
      - bench/worker/**
      - bench/manifests/**
      - bench/kind/**
      - internal/headroom/**
      - internal/aimd/**
      - internal/state/**
      - internal/proxy/**
      - internal/headers/**
      - cmd/**
      - go.mod
      - go.sum
      - Dockerfile
      - deploy/helm/**
      - internal/scaler/**

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.1
      - name: install kind with its release checksum
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind-linux-amd64" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLo "$RUNNER_TEMP/kind-linux-amd64.sha256sum" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          (cd "$RUNNER_TEMP" && sha256sum -c kind-linux-amd64.sha256sum)
          sudo install -m 0755 "$RUNNER_TEMP/kind-linux-amd64" /usr/local/bin/kind
      - name: compare queue-only, static and adaptive policies twice
        env:
          BENCH_RESULTS: ${{ runner.temp }}/changing-quota-results
        run: make bench-changing
      - name: retain every completed trial
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: changing-quota-results
          path: ${{ runner.temp }}/changing-quota-results
          if-no-files-found: warn
      - name: retain failure diagnostics
        if: failure()
        env:
          KUBECONFIG: bench/kind/.kubeconfig
        run: |
          kubectl -n quotaware-demo get pods,jobs,hpa
          kubectl -n quotaware-demo logs job/producer --tail=50
          kubectl -n quotaware-demo logs deploy/quotaware --tail=50
      - name: remove the benchmark cluster
        if: always()
        run: make demo-down

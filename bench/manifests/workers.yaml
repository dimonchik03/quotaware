apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-workers
  namespace: quotaware-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-workers
  template:
    metadata:
      labels:
        app: llm-workers
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: quotaware-worker:dev
          imagePullPolicy: Never
          args:
            - -redis=redis:6379
            - -proxy=http://quotaware:8080
            - -model=gpt-4.1-mini
            - -concurrency=2
            - -metrics=:9101
            - -linger=15s
          env:
            - name: API_KEY
              value: sk-bench
          ports:
            - containerPort: 9101
          resources:
            requests:
              cpu: 10m
              memory: 16Mi

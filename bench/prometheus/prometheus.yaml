apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: quotaware-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quotaware-bench-prometheus
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: quotaware-bench-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: quotaware-bench-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: quotaware-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: quotaware-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: workers
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [quotaware-demo]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: llm-workers
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:9101
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: producer
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [quotaware-demo]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: producer
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:9102
            target_label: __address__
      - job_name: quotaware
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [quotaware-demo]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: quotaware
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:9100
            target_label: __address__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: quotaware-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=6h
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
      volumes:
        - name: config
          configMap:
            name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: quotaware-demo
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
